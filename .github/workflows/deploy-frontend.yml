name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project=smart-traffic-dab1e --token=${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore Rules & Indexes
        run: firebase deploy --only firestore --project=smart-traffic-dab1e --token=${{ secrets.FIREBASE_TOKEN }}