name: Deploy Smart Trafik

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: smart-traffic-dab1e
  REGION: asia-southeast1
  SERVICE_NAME: smart-trafik-api

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/smart-trafik/${SERVICE_NAME}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/smart-trafik/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: "--allow-unauthenticated --port=8080 --memory=2Gi --cpu=2 --max-instances=10 --set-env-vars=FIREBASE_PROJECT_ID=${PROJECT_ID},FIREBASE_ENABLED=true,ALLOWED_ORIGINS=https://${PROJECT_ID}.web.app"

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
      HLS_URL: ${{ secrets.CCTV_HLS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend with production API URL
        run: |
          if [ -z "$HLS_URL" ]; then
            echo "::error::GitHub Secret CCTV_HLS_URL belum ditetapkan."
            exit 1
          fi
          cd frontend
          VITE_API_BASE_URL="$BACKEND_URL" VITE_HLS_URL="$HLS_URL" npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.PROJECT_ID }}
          channelId: live
